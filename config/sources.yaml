sources:

  - id: chicago_permits
    category: permit
    jurisdiction: Chicago, IL
    adapter: socrata
    domain: data.cityofchicago.org
    dataset: ydr8-5enu
    date_field: application_start_date
    days_back: 14
    map:
      record_id: id
      address: [street_number, street_direction, street_name]
      event_date: application_start_date
      status: permit_status
      description: work_description
      party: permit_type
      amount: reported_cost

  - id: chicago_code_violations
    category: code_violation
    jurisdiction: Chicago, IL
    adapter: socrata
    domain: data.cityofchicago.org
    dataset: 22u3-xenr
    date_field: violation_date
    days_back: 14
    map:
      record_id: id
      address: address
      event_date: violation_date
      status: violation_status
      description: violation_description
      party: violation_code

  - id: sf_permits
    category: permit
    jurisdiction: San Francisco, CA
    adapter: socrata
    domain: data.sfgov.org
    dataset: i98e-djp9
    date_field: filed_date
    days_back: 14
    map:
      record_id: permit_number
      address: [street_number, street_name, street_suffix]
      event_date: filed_date
      status: status
      description: description
      party: permit_type_definition
      amount: estimated_cost

  - id: sf_code_violations
    category: code_violation
    jurisdiction: San Francisco, CA
    adapter: socrata
    domain: data.sfgov.org
    dataset: nbtm-fbw5
    date_field: date_filed
    days_back: 14
    map:
      record_id: [complaint_number, item_sequence_number]
      address: [street_number, street_name, street_suffix]
      event_date: date_filed
      status: status
      description: nov_item_description
      party: nov_category_description

  - id: kluever_foreclosure_sales
    category: preforeclosure
    jurisdiction: Cook County, IL
    adapter: table
    url: https://www.klueverlawgroup.com/4BA773/kp_sales.html
    columns:
      event_date: "Sale Date"
      record_id: "File #"
      street: "Street"
      city: "City"
      zip: "Zip"
      amount: "Bid"
    keep:
      County: Cook
    static:
      status: Auction scheduled
      description: Foreclosure auction scheduled
    map:
      record_id: record_id
      address: [street, city, zip]
      event_date: event_date
      amount: amount
      status: status
      description: description
